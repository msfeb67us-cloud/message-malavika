<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Malavika</title>
    
    <!-- Tailwind CSS for layout and utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Loading Google Fonts: Playfair Display for elegance, Inter for clean body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #050814;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            min-height: 100vh;
            overflow: hidden; /* Prevents scrolling caused by moving orbs */
        }

        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        .font-inter {
            font-family: 'Inter', sans-serif;
        }

        /* Ambient Glowing Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
        }

        .orb-1 {
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%); /* Champagne Gold */
            top: -10%;
            left: -10%;
            animation: floatOrb1 20s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(232, 180, 184, 0.25) 0%, transparent 80%); /* Soft Blush Pink */
            bottom: -20%;
            right: -10%;
            animation: floatOrb2 25s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 15vh) scale(1.1); }
        }

        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-15vw, -10vh) scale(1.05); }
        }

        /* High-end cubic-bezier easing for the text reveal */
        .reveal-wrapper {
            overflow: hidden;
            display: block; /* Changed to block for sentence-by-sentence stacking */
        }

        .reveal-text {
            opacity: 0;
            transform: translateY(110%);
            display: inline-block;
            animation: smoothReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes smoothReveal {
            0% {
                opacity: 0;
                transform: translateY(110%);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Staggered delays for the cinematic reveal */
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.9s; }
        .delay-3 { animation-delay: 1.2s; }
        .delay-4 { animation-delay: 1.5s; }
        .delay-5 { animation-delay: 1.8s; }
    </style>
</head>
<body class="relative flex items-center justify-center">

    <!-- Low-opacity cinematic floral background -->
    <div class="absolute inset-0 z-0" 
         style="background-image: url('https://images.unsplash.com/photo-1563241527-3004b7be0ffd?q=80&w=2000&auto=format&fit=crop'); 
                background-size: cover; 
                background-position: center; 
                opacity: 0.12; 
                mix-blend-mode: luminosity;">
    </div>

    <!-- Colorful Glowing Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Foreground Content -->
    <main class="relative z-10 w-full max-w-6xl px-6 md:px-12 lg:px-24 flex flex-col items-center justify-center text-center">
        
        <!-- The Name - Elegant Playfair Display in Champagne Gold -->
        <div class="mb-10 md:mb-16">
            <div class="reveal-wrapper">
                <h1 class="reveal-text delay-1 font-playfair text-6xl md:text-8xl lg:text-[9rem] font-semibold tracking-tight text-[#D4AF37] drop-shadow-lg">
                    Malavika.
                </h1>
            </div>
        </div>
        
        <!-- The Message - Clean Inter, crisp off-white, high line-height -->
        <div class="font-inter space-y-2 md:space-y-4 text-xl md:text-3xl lg:text-4xl font-light text-[#E2E8F0] leading-loose md:leading-loose max-w-4xl">
            
            <div class="reveal-wrapper">
                <span class="reveal-text delay-2">
                    You’re incredibly talented,
                </span>
            </div>
            
            <div class="reveal-wrapper">
                <span class="reveal-text delay-3">
                    and watching you crush it with your career,
                </span>
            </div>

            <div class="reveal-wrapper">
                <span class="reveal-text delay-4">
                    your music, and your languages
                </span>
            </div>

            <div class="reveal-wrapper">
                <span class="reveal-text delay-5">
                    inspires me every single day.
                </span>
            </div>

        </div>

    </main>

</body>
</html>
