<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Malavika</title>
    
    <!-- Tailwind CSS for layout and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Loading Google Fonts: Playfair Display for the elegant name, Inter for standard UI text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Classic Pinterest background color */
            background-color: #e9e9e9; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 24px;
        }

        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        /* Beautiful pastel peach/pink mesh gradient to act as the "Pin Image" */
        .mesh-gradient {
            background-color: #ffe5e5;
            background-image: 
                radial-gradient(at 10% 20%, rgba(255, 192, 203, 0.8) 0px, transparent 50%),
                radial-gradient(at 80% 0%, rgba(255, 178, 153, 0.8) 0px, transparent 50%),
                radial-gradient(at 0% 80%, rgba(255, 218, 185, 0.8) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 182, 193, 0.8) 0px, transparent 50%);
            /* Smooth background animation for extra polish */
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite alternate;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Subtle fade-in and slide-up animation for the card */
        .card-reveal {
            opacity: 0;
            transform: translateY(40px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- Cute dog scene ---- */
        .dog-bob {
            animation: dogBob 2.5s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes dogBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-8px) rotate(-1.5deg); }
        }

        /* Wagging tail */
        .dog-tail {
            transform-origin: 150px 130px;
            animation: tailWag 0.4s ease-in-out infinite alternate;
        }
        @keyframes tailWag {
            0%   { transform: rotate(-12deg); }
            100% { transform: rotate(18deg); }
        }

        /* Blinking eyes */
        .dog-eye {
            transform-origin: center;
            animation: blink 4s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 92%, 100% { transform: scaleY(1); }
            96%           { transform: scaleY(0.1); }
        }

        /* Speech bubble */
        .speech-bubble {
            position: relative;
            background: #ffffff;
            color: #E60023;
            font-weight: 700;
            font-size: 1.25rem;
            padding: 12px 22px;
            border-radius: 22px;
            margin-bottom: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            white-space: nowrap;
            animation: bubblePop 2.5s ease-in-out infinite;
        }
        .bubble-tail {
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 12px solid #ffffff;
        }
        @keyframes bubblePop {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-4px) scale(1.04); }
        }

        /* Custom scrollbar to match Pinterest style for the right pane */
        .scrollable-pane::-webkit-scrollbar {
            width: 8px;
        }
        .scrollable-pane::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollable-pane::-webkit-scrollbar-thumb {
            background-color: #d1d5db;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- The central "Pin Detail" card container -->
    <main class="card-reveal w-full max-w-5xl bg-white rounded-[32px] shadow-[0_8px_30px_rgb(0,0,0,0.08)] flex flex-col md:flex-row overflow-hidden min-h-[600px]">
        
        <!-- Left Side: Aesthetic Pin Image (Mesh Gradient) -->
        <div class="mesh-gradient w-full md:w-[45%] h-[400px] md:h-auto relative flex items-center justify-center">
            <!-- Subtle overlay to make it look like a real image -->
            <div class="absolute inset-0 bg-white/10 mix-blend-overlay"></div>

            <!-- Cute animated dog with a speech bubble -->
            <div class="dog-scene relative flex flex-col items-center w-[80%]">
                <!-- Speech bubble -->
                <div class="speech-bubble font-playfair">
                    You're amazing! 
                    <span class="bubble-tail"></span>
                </div>

                <!-- The real Chippy the Dog GIF from Giphy -->
                <div class="dog-bob w-full">
                    <img
                        src="https://media.giphy.com/media/3o6fJ6zHaMnuHgxWuY/giphy.gif"
                        alt="Cute dog saying you are amazing"
                        class="w-full h-auto object-contain rounded-3xl shadow-lg bg-white/40 p-2"
                    />
                </div>
            </div>

            <!-- Decorative icon in the corner just for realism -->
            <div class="absolute bottom-4 left-4 bg-white/30 backdrop-blur-sm rounded-full p-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white drop-shadow-md"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </div>
        </div>

        <!-- Right Side: Pinterest UI and Content -->
        <div class="w-full md:w-[55%] flex flex-col h-full md:min-h-[600px]">
            
            <!-- Top Action Bar (Profile & Save) -->
            <div class="flex items-center justify-between p-6 md:p-8">
                <!-- Profile Section -->
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-gray-700 font-bold text-xl uppercase">
                        S
                    </div>
                    <div>
                        <p class="text-sm font-semibold text-gray-900 leading-tight">Suhas</p>
                        <p class="text-xs text-gray-500">For you</p>
                    </div>
                </div>

                <!-- Pinterest 'Save' Button -->
                <button class="bg-[#E60023] hover:bg-[#ad081b] text-white font-semibold text-base px-6 py-3 rounded-full transition-colors duration-200 shadow-sm">
                    Save
                </button>
            </div>

            <!-- Main Content Area (The Message) -->
            <div class="flex-grow scrollable-pane overflow-y-auto px-6 md:px-10 pb-10 pt-4 flex flex-col justify-center">
                
                <!-- Elegant Heading -->
                <h1 class="font-playfair text-5xl md:text-6xl font-bold text-gray-900 mb-6 tracking-tight">
                    Malavika,
                </h1>
                
                <!-- Heartfelt Body Text -->
                <p class="text-gray-700 text-lg md:text-xl leading-relaxed">
                    You’re incredibly talented, and watching you crush it with your career, your music, and your languages inspires me every single day.
                </p>

                <!-- Optional: Subtle visual divider to anchor the bottom space -->
                <div class="mt-12 w-12 h-1 bg-gray-200 rounded-full"></div>
            </div>

            <!-- Bottom Action Icons (Pinterest interaction realism) -->
            <div class="px-6 md:px-8 py-6 flex items-center gap-4 text-gray-900 mt-auto border-t border-gray-100">
                <!-- Heart Icon -->
                <button class="hover:bg-gray-100 p-3 rounded-full transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </button>
                <!-- Share Icon -->
                <button class="hover:bg-gray-100 p-3 rounded-full transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
                </button>
                <!-- More Icon -->
                <button class="hover:bg-gray-100 p-3 rounded-full transition-colors ml-auto">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
            </div>

        </div>
    </main>

</body>
</html>
